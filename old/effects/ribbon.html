<!-- ABOUTME: Ribbon animation effect for Recode Labs -->
<!-- ABOUTME: Animates SVG ribbon paths with GSAP masking effects -->
<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Recode Labs - Ribbon</title>
        <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
        <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                background: black;
                overflow: hidden;
                margin: 0;
                min-height: 100vh;
                display: flex;
                justify-content: center;
                align-items: center;
            }

            .background-svg {
                position: fixed;
                top: 0;
                left: 0;
                width: 100vw;
                height: 100vh;
                opacity: 0;
                z-index: 0;
            }

            .container {
                position: relative;
                z-index: 1;
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 20px;
            }

            .logo {
                width: 40vw;
                height: auto;
            }

            </style>
    </head>
    <body>
        <div id="svgContainer"></div>
        <div class="container">
            <object
                type="image/svg+xml"
                data="../image/recodelabs.svg"
                class="logo"
                id="logo"
            ></object>
        </div>
        <script>
            fetch("../image/ribbons.svg")
                .then((response) => response.text())
                .then((svgText) => {
                    const container = document.getElementById("svgContainer");
                    container.innerHTML = svgText;

                    const svg = container.querySelector("svg");
                    svg.classList.add("background-svg");

                    const paths = svg.querySelectorAll("path");
                    let defs = svg.querySelector("defs");
                    const xmlns = "http://www.w3.org/2000/svg";

                    if (!defs) {
                        defs = document.createElementNS(xmlns, "defs");
                        svg.insertBefore(defs, svg.firstChild);
                    }

                    paths.forEach((p, i) => {
                        const clone = p.cloneNode();
                        clone.setAttribute("stroke-dasharray", "");
                        clone.setAttribute("stroke", "white");
                        const mask = document.createElementNS(xmlns, "mask");
                        mask.setAttribute("id", `id-${i}`);
                        mask.appendChild(clone);
                        defs.appendChild(mask);
                        p.setAttribute("mask", `url(#id-${i})`);
                        gsap.set(clone, {
                            strokeDasharray: () => clone.getTotalLength(),
                            strokeDashoffset: () => clone.getTotalLength(),
                        });
                        gsap.to(clone, {
                            duration: 20,
                            delay: i * 0.1,
                            repeat: -1,
                            strokeDashoffset: clone.getTotalLength() * 3,
                            ease: "power1.inOut",
                        });
                        gsap.to(p, {
                            duration: 20,
                            repeat: -1,
                            strokeDashoffset: clone.getTotalLength() * 0.4,
                            ease: "none",
                        });
                    });

                    svg.style.opacity = 1;
                })
                .catch((err) =>
                    console.error("Failed to load ribbons.svg:", err),
                );
        </script>
        <script src="logo-setup.js"></script>
        <script>
            setupLogo("logo", "white");

            // Twitch timer
            setInterval(function () {
                var logo = document.getElementById("logo");
                if (logo && logo.contentDocument) {
                    var o = logo.contentDocument.getElementById("reload-o");
                    if (o) {
                        o.style.transition = "transform 0.1s ease-in-out";
                        o.style.transform = "rotate(15deg)";
                        setTimeout(function () {
                            o.style.transform = "rotate(-10deg)";
                            setTimeout(function () {
                                o.style.transform = "rotate(5deg)";
                                setTimeout(function () {
                                    o.style.transform = "rotate(0deg)";
                                }, 100);
                            }, 100);
                        }, 100);
                    }
                }
            }, 7000);
        </script>
    </body>
</html>
