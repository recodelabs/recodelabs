<!-- ABOUTME: Rotating squares animation effect for Recode Labs -->
<!-- ABOUTME: Canvas-based animation with pseudo-random rotating rectangles -->
<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Recode Labs - Rotating Squares</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            html,
            body {
                width: 100%;
                height: 100%;
                background: #ddd;
                display: flex;
                justify-content: center;
                align-items: center;
            }

            canvas {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                z-index: 0;
            }

            .container {
                position: relative;
                z-index: 1;
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 20px;
            }

            .logo {
                width: 40vw;
                height: auto;
            }

            .logo path,
            .logo polygon {
                fill: #e05939;
            }

            .logo .letter-o {
                cursor: pointer;
                transform-origin: 405px 302px;
                transition: transform 0.3s ease;
            }

            .logo .letter-o:hover {
                transform: rotate(45deg);
            }

            .logo .letter-o.spinning {
                animation: spin 0.5s ease-in-out;
            }

            @keyframes spin {
                from {
                    transform: rotate(0deg);
                }
                to {
                    transform: rotate(360deg);
                }
            }

            .remix-btn {
                background: transparent;
                border: none;
                cursor: pointer;
                padding: 10px;
                opacity: 0.7;
                transition:
                    opacity 0.3s,
                    transform 0.3s;
            }

            .remix-btn:hover {
                opacity: 1;
                transform: rotate(180deg);
            }

            .remix-btn svg {
                width: 32px;
                height: 32px;
                fill: #e05939;
            }
        </style>
    </head>
    <body>
        <canvas></canvas>
        <div class="container">
            <object
                type="image/svg+xml"
                data="../image/recodelabs.svg"
                class="logo"
                id="logo"
            ></object>
        </div>
        <script>
            const canvas = document.querySelector("canvas");
            const cx = canvas.getContext("2d");

            const INCREMENT = 12345;
            const MULTIPLIER = 1103515245;
            const MODULUS = Math.pow(2, 31);

            const stepX = 16;
            const stepY = 16;
            const sizeX = 1;
            const sizeY = 1;
            const marginTop = 32;
            const marginBottom = 32;
            const marginLeft = 32;
            const marginRight = 32;

            let frameID;

            function lcg(x, c = INCREMENT, a = MULTIPLIER, m = MODULUS) {
                return (a * x + c) % m;
            }

            function createRandom(initialSeed = 0) {
                let seed = initialSeed;
                return {
                    get currentSeed() {
                        return seed;
                    },
                    reset(newSeed) {
                        seed = newSeed;
                    },
                    get() {
                        seed = lcg(seed);
                        return seed / MODULUS;
                    },
                };
            }

            const random = createRandom();

            function frame(frameTime) {
                cx.clearRect(0, 0, cx.canvas.width, cx.canvas.height);
                for (
                    let y = marginTop;
                    y < cx.canvas.height - marginBottom;
                    y += stepY
                ) {
                    random.reset(y);
                    for (
                        let x = marginLeft;
                        x < cx.canvas.width - marginRight;
                        x += stepX
                    ) {
                        const randomValue = random.get();
                        const distX = randomValue * 4;
                        const distY = randomValue * 4;
                        const phase = randomValue * Math.PI * 2;
                        cx.fillStyle = "#000";
                        cx.fillRect(
                            x,
                            y,
                            sizeX + Math.sin(phase + frameTime / 1000) * distX,
                            sizeY + Math.cos(phase + frameTime / 1000) * distY,
                        );
                    }
                }
                frameID = window.requestAnimationFrame(frame);
            }

            function resize() {
                canvas.width = canvas.clientWidth;
                canvas.height = canvas.clientHeight;
            }

            function start() {
                window.addEventListener("resize", resize);
                window.dispatchEvent(new Event("resize"));
                frameID = window.requestAnimationFrame(frame);
            }

            start();
        </script>
        <script src="logo-setup.js"></script>
        <script>
            setupLogo("logo", "#e05939");

            // Twitch timer
            setInterval(function () {
                var logo = document.getElementById("logo");
                if (logo && logo.contentDocument) {
                    var o = logo.contentDocument.getElementById("reload-o");
                    if (o) {
                        o.style.transition = "transform 0.1s ease-in-out";
                        o.style.transform = "rotate(15deg)";
                        setTimeout(function () {
                            o.style.transform = "rotate(-10deg)";
                            setTimeout(function () {
                                o.style.transform = "rotate(5deg)";
                                setTimeout(function () {
                                    o.style.transform = "rotate(0deg)";
                                }, 100);
                            }, 100);
                        }, 100);
                    }
                }
            }, 7000);
        </script>
    </body>
</html>
