<!-- ABOUTME: Birds animation effect for Recode Labs using Vanta.js -->
<!-- ABOUTME: 3D birds flocking animation with Three.js -->
<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Recode Labs - Birds</title>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r121/three.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.birds.min.js"></script>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            html,
            body {
                width: 100%;
                height: 100%;
                background: #1a1a2e;
            }

            .vanta-bg {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                z-index: 0;
            }

            .container {
                position: relative;
                z-index: 1;
                width: 100%;
                height: 100%;
                display: flex;
                justify-content: center;
                align-items: center;
            }

            .logo {
                width: 40vw;
                height: auto;
            }
        </style>
    </head>
    <body>
        <div class="vanta-bg" id="vanta-bg"></div>
        <div class="container">
            <object
                type="image/svg+xml"
                data="../image/recodelabs.svg"
                class="logo"
                id="logo"
            ></object>
        </div>
        <script>
            if (window.VANTA) {
                window.VANTA.BIRDS({
                    el: "#vanta-bg",
                    mouseControls: true,
                    touchControls: true,
                    gyroControls: false,
                    minHeight: 200.0,
                    minWidth: 200.0,
                    scale: 1.0,
                    scaleMobile: 1.0,
                    backgroundColor: 0x1a1a2e,
                    color1: 0xe05939,
                    color2: 0xff8c69,
                    birdSize: 1.5,
                    wingSpan: 20.0,
                    separation: 50.0,
                    alignment: 50.0,
                    cohesion: 50.0,
                    quantity: 3.0,
                });
            }
        </script>
        <script src="logo-setup.js"></script>
        <script>
            setupLogo("logo", "white");

            // Twitch timer
            setInterval(function () {
                var logo = document.getElementById("logo");
                if (logo && logo.contentDocument) {
                    var o = logo.contentDocument.getElementById("reload-o");
                    if (o) {
                        o.style.transition = "transform 0.1s ease-in-out";
                        o.style.transform = "rotate(15deg)";
                        setTimeout(function () {
                            o.style.transform = "rotate(-10deg)";
                            setTimeout(function () {
                                o.style.transform = "rotate(5deg)";
                                setTimeout(function () {
                                    o.style.transform = "rotate(0deg)";
                                }, 100);
                            }, 100);
                        }, 100);
                    }
                }
            }, 7000);
        </script>
    </body>
</html>
