<!-- ABOUTME: Ribbon animation effect for Recode Labs -->
<!-- ABOUTME: Animates SVG ribbon paths with GSAP masking effects -->
<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Recode Labs - Ribbon</title>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                background: black;
                overflow: hidden;
                margin: 0;
                min-height: 100vh;
                display: flex;
                justify-content: center;
                align-items: center;
            }

            .background-svg {
                position: fixed;
                top: 0;
                left: 0;
                width: 100vw;
                height: 100vh;
                opacity: 0;
                z-index: 0;
            }

            .container {
                position: relative;
                z-index: 1;
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 20px;
            }

            .logo {
                width: 40vw;
                height: auto;
                filter: brightness(0) invert(1);
            }

            .remix-btn {
                background: transparent;
                border: none;
                cursor: pointer;
                padding: 10px;
                opacity: 0.7;
                transition: opacity 0.3s, transform 0.3s;
            }

            .remix-btn:hover {
                opacity: 1;
                transform: rotate(180deg);
            }

            .remix-btn svg {
                width: 32px;
                height: 32px;
                fill: white;
            }
        </style>
    </head>
    <body>
        <div id="svgContainer"></div>
        <div class="container">
            <img src="../image/recodelabs.svg" alt="Recode Labs" class="logo" />
            <button class="remix-btn" onclick="window.parent.postMessage('remix', '*')" title="Remix">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
                </svg>
            </button>
        </div>
        <script>
            fetch('../image/ribbons.svg')
                .then(response => response.text())
                .then(svgText => {
                    const container = document.getElementById('svgContainer');
                    container.innerHTML = svgText;

                    const svg = container.querySelector('svg');
                    svg.classList.add('background-svg');

                    const paths = svg.querySelectorAll("path");
                    let defs = svg.querySelector("defs");
                    const xmlns = "http://www.w3.org/2000/svg";

                    if (!defs) {
                        defs = document.createElementNS(xmlns, "defs");
                        svg.insertBefore(defs, svg.firstChild);
                    }

                    paths.forEach((p, i) => {
                        const clone = p.cloneNode();
                        clone.setAttribute("stroke-dasharray", "");
                        clone.setAttribute("stroke", "white");
                        const mask = document.createElementNS(xmlns, "mask");
                        mask.setAttribute("id", `id-${i}`);
                        mask.appendChild(clone);
                        defs.appendChild(mask);
                        p.setAttribute("mask", `url(#id-${i})`);
                        gsap.set(clone, {
                            strokeDasharray: () => clone.getTotalLength(),
                            strokeDashoffset: () => clone.getTotalLength(),
                        });
                        gsap.to(clone, {
                            duration: 20,
                            delay: i * 0.2,
                            repeat: -1,
                            strokeDashoffset: clone.getTotalLength() * 3,
                            ease: "power1.inOut",
                        });
                        gsap.to(p, {
                            duration: 20,
                            repeat: -1,
                            strokeDashoffset: clone.getTotalLength() * 0.4,
                            ease: "none",
                        });
                    });

                    svg.style.opacity = 1;
                })
                .catch(err => console.error('Failed to load ribbons.svg:', err));
        </script>
    </body>
</html>
