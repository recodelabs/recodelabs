<!-- ABOUTME: Main entry point for Recode Labs that randomly loads visual effects -->
<!-- ABOUTME: Handles effect selection and remix functionality via iframe -->
<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Recode Labs</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            html,
            body {
                width: 100%;
                height: 100%;
                overflow: hidden;
            }

            iframe {
                width: 100%;
                height: 100%;
                border: none;
            }
        </style>
    </head>
    <body>
        <iframe id="effectFrame"></iframe>
        <script>
            const effects = [
                "effects/ribbon.html",
                "effects/rotating-squares.html",
                "effects/birds.html",
            ];

            let currentEffect = null;

            function getRandomEffect(excludeCurrent) {
                if (effects.length === 1) {
                    return effects[0];
                }

                let available = effects;
                if (excludeCurrent) {
                    available = effects.filter((e) => e !== currentEffect);
                }

                const index = Math.floor(Math.random() * available.length);
                return available[index];
            }

            function loadEffect(effectPath) {
                currentEffect = effectPath;
                document.getElementById("effectFrame").src = effectPath;

                // Store in sessionStorage so we know what to exclude on remix
                sessionStorage.setItem("currentEffect", effectPath);
            }

            function remix() {
                const newEffect = getRandomEffect(true);
                loadEffect(newEffect);
            }

            // Listen for remix messages from child frames
            window.addEventListener("message", function (event) {
                if (event.data === "remix") {
                    remix();
                }
            });

            // On load, pick a random effect
            const stored = sessionStorage.getItem("currentEffect");
            if (stored && effects.includes(stored)) {
                // If coming back to page, pick a different one
                currentEffect = stored;
                remix();
            } else {
                loadEffect(getRandomEffect(false));
            }
        </script>
    </body>
</html>
